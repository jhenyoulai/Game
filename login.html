<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>登入頁面</title>
</head>
<body>

    <h2>登入 Login</h2>

    <label>帳號：</label>
    <input type="text" id="account"><br><br>

    <label>密碼：</label>
    <input type="password" id="password"><br><br>

    <button onclick="login()">登入</button>

    <script>
        async function login() {
            let acc = document.getElementById("account").value;
            let pwd = document.getElementById("password").value;

            // 讀取 player.json
            const response = await fetch("player.json");
            const data = await response.json();

            // 單一帳號情況
            if (acc === data.account && pwd === data.password) {
                window.location.href = "myself.html";
                return;
            }

            alert("帳號或密碼錯誤！");
        }
    </script>

</body>
</html>
