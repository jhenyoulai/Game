<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>登入</title>
</head>
<body>
  <h2>登入</h2>
  <label>帳號：</label>
  <input type="text" id="account"><br>
  <label>密碼：</label>
  <input type="password" id="password"><br>
  <button onclick="login()">登入</button>

  <script>
    async function login() {
      const acc = document.getElementById("account").value;
      const pwd = document.getElementById("password").value;

      try {
        const response = await fetch("./player.json?ts=" + Date.now());
        if (!response.ok) {
          throw new Error("讀取 player.json 失敗: " + response.status);
        }
        const data = await response.json();

        const players = data.players;
        const found = players.find(p => p.account === acc && p.password === pwd);

        if (found) {
          window.location.href = "myself.html";
        } else {
          alert("帳號或密碼錯誤！");
        }
      } catch (err) {
        console.error("登入時發生錯誤：", err);
        alert("系統錯誤，請稍後再試。");
      }
    }
  </script>
</body>
</html>
